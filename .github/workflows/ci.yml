name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Build (tsc and vite)
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (classifier)
        run: npm run test:unit
